; ============================================================================
; Passive RF Capture Unit — receive-only WiFi (promiscuous) + BLE (active scan)
;
; The capture is done entirely by the ESP32's own 2.4 GHz radio. Any NRF24L01+
; or CC1101 modules on the board are NOT used for WiFi/BLE capture (see README:
; NRF24 is a proprietary 2.4 GHz radio, CC1101 is sub-GHz only).
;
; Three build targets are provided because the capture firmware is identical
; across ESP32 variants. Pick the one that matches your hardware:
;   pio run -e esp32c3   ->  ESP32-C3 SuperMini (already-soldered board)
;   pio run -e esp32s3   ->  ESP32-S3 DevKitC-1 (recommended upgrade)
;   pio run -e esp32dev  ->  classic ESP32-WROOM-32 / 32U / 32E
; ============================================================================
[platformio]
default_envs = esp32c3

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    h2zero/NimBLE-Arduino @ ^1.4.2

; NimBLE (not the default Bluedroid stack) is used so the BLE stack and the
; WiFi driver both fit in RAM at once; the controller's software coexistence
; time-slices the shared antenna between the two.

[env:esp32c3]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -DRFCAP_BOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

[env:esp32s3]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -DRFCAP_BOARD_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
extends = common
platform = espressif32
board = esp32dev
build_flags =
    -DRFCAP_BOARD_CLASSIC
    -DCORE_DEBUG_LEVEL=1

; ============================================================================
; Sub-GHz Capture Unit (Board B) — CC1101 passive listener, streams to Board A
;
; Receive-only. Uses no external libraries (bare-metal CC1101 SPI driver).
; The CC1101 board's ESP32 does not use its own radio, so any ESP32 works;
; S3 is the default/recommended. ESP32-C5 also works but its dual-band WiFi is
; unused here and its Arduino/PlatformIO support is newer — treat as experimental.
;
;   pio run -e esp32s3    ->  ESP32-S3 DevKitC-1 (recommended)
;   pio run -e esp32c3    ->  ESP32-C3
;   pio run -e esp32dev   ->  classic ESP32-WROOM-32 / 32U / 32E
; ============================================================================
[platformio]
default_envs = esp32s3

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:esp32s3]
extends = common
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    -DRFCAP_BOARD_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
extends = common
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    -DRFCAP_BOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
extends = common
platform = espressif32
board = esp32dev
build_flags =
    -DRFCAP_BOARD_CLASSIC

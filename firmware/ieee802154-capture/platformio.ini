; ============================================================================
; IEEE 802.15.4 Capture + Web Hub (Board C) — Waveshare ESP32-C6-LCD-1.47
;
; Passive Zigbee/Thread/Matter-over-Thread sniffer on the ESP32-C6's native
; 802.15.4 radio, with a live LVGL-free dashboard on the 1.47" TFT and a web UI
; that also shows Board A's WiFi/BLE + Board B's sub-GHz telemetry (received over
; the UART link). Receive-only: it never transmits 802.15.4 or joins a network.
;
; Display controller is selected at build time so both board variants work:
;   default (esp32c6)        -> ST7789  (non-touch ESP32-C6-LCD-1.47)
;   pio run -e esp32c6_jd9853 -> JD9853 (touch ESP32-C6-Touch-LCD-1.47)
; ============================================================================
[platformio]
default_envs = esp32c6

[common]
; ESP32-C6 Arduino support requires Arduino-ESP32 3.x, which the official
; PlatformIO espressif32 platform did not ship at time of writing. Use the
; community pioarduino platform fork (IDF 5.5 / Arduino 3.x) which supports C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.0

[env:esp32c6]
extends = common
board = esp32-c6-devkitc-1
build_flags =
    -DRFCAP_BOARD_C6
    -DDISPLAY_ST7789
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6_jd9853]
extends = common
board = esp32-c6-devkitc-1
build_flags =
    -DRFCAP_BOARD_C6
    -DDISPLAY_JD9853
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

                    - paragraph [ref=e436]: "We’re looking for a HubSpot CRM expert who can design the overall CRM architecture, build automation, and implement integrations—not just configure basic fields and views. You will own the HubSpot setup end-to-end, from data structure and workflows to integrations with Google products and our third‑party website. Key Responsibilities Audit and optimize our existing HubSpot portal, including objects, pipelines, lifecycle stages, properties, lists, and permissions. Design and implement automated client updates (emails, tasks, notifications) driven by HubSpot workflows and clearly defined triggers (e.g., deal stage changes, form submissions). Build and maintain integrations between HubSpot and: Google Sheets for two-way data sync and operational reporting. Google Docs and Drive for structured storage and easy access to client documents from within HubSpot records. Connect HubSpot to our 3rd‑party website: Implement form capture and tracking. Send events and data from the website into HubSpot. Expose HubSpot data back to the site as needed (e.g., client portal / logged-in experiences). Use native integrations, marketplace apps, and/or no-code tools (Zapier, Make, n8n, etc.) to orchestrate data flows where appropriate. Work with APIs (HubSpot, Google, and website backend) to implement and document custom integrations when off‑the‑shelf tools aren’t sufficient. Set up dashboards and reports to give leadership and operations clear visibility into the client lifecycle and pipeline. Document the architecture, integrations, and workflows so they can be maintained and extended over time."

                    - paragraph [ref=e506]: "Workflow & Airtable Specialist for High-Volume Casting/Application Process Project Overview We are a television production company developing a large-scale, non-traditional casting initiative. We anticipate collecting questionnaire responses from potentially 2,000+ applicants and are seeking an experienced workflow architect to help design and implement an efficient intake, review, and applicant management system. This workflow will likely involve multiple platforms, including questionnaire and form tools, Airtable (or a similar database solution), automation platforms, and industry-specific production and licensing systems. We are looking for someone who can help us evaluate the best combination of tools and create a seamless workflow between them. What We Need We’re looking for a consultant/developer who can: * Design a scalable workflow for managing 2,000+ applicants * Integrate multiple platforms into a unified process * Centralize applicant data into Airtable or a similar database * Build workflows for reviewing, tagging, filtering, and evaluating submissions * Create automations that reduce manual data entry and administrative work * Help manage movement of applicants through multiple stages of the casting process * Integrate with industry-specific rights, release, licensing, or production management platforms where appropriate Ideal Experience * Airtable database architecture and optimization * Workflow automation (Zapier, Make, APIs, custom integrations) * High-volume application, casting, recruiting, or research workflows * Production, casting, or media-industry operations * Experience integrating third-party rights management, licensing, release management, or production systems * Ability to recommend solutions rather than simply build to a predefined specification To Apply Please provide: 1. Examples of similar workflows you have designed and built 2. Experience with media, production, casting, or licensing-related systems 3. Your recommended tech stack for a project of this scale 4. Estimated timeline and availability We’re currently in the planning phase and are looking for a strategic partner who can help architect the workflow before implementation begins."

                    - heading "Make.com Integration Specialist Needed – TrackOps to QuickBooks Online Build for 3 Companies" [level=2] [ref=e529]:
                      - link "Make.com Integration Specialist Needed – TrackOps to QuickBooks Online Build for 3 Companies" [ref=e530]:
                        - /url: /jobs/Make-com-Integration-Specialist-Needed-TrackOps-QuickBooks-Online-Build-for-Companies_~022069766332652525573/?referrer_url_path=/nx/search/jobs/
                  - generic [ref=e531]:
                    - list [ref=e532]:
                      - listitem [ref=e533]:

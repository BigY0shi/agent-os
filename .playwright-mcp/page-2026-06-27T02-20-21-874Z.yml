                        - strong [ref=e538]: "Est. budget:"
                        - strong [ref=e539]: $5.00
                    - paragraph [ref=e542]: "Job Description I am looking for an experienced Make.com automation/integration specialist with strong QuickBooks Online experience to build and complete a TrackOps to QuickBooks Online integration for my three businesses. This is not a simple “push an invoice from one system to another” project. The integration needs to handle real accounting workflows accurately across three separate companies using one centralized Make environment, with each company maintaining its own isolated TrackOps and QuickBooks Online account. I have already gone through unsuccessful contractor attempts on this project, so I want to be very clear up front: I am looking for someone who can actually build, test, and demonstrate working functionality in my environment - not someone who can only write a polished proposal. To confirm you read this post, please begin your proposal with the words: TrackOps verified ________________________________________ Business / System Environment You will be working with three separate operating companies: • Megalodon Executive Protection Firm, LLC (EP) • Megalodon Private Investigations Firm, PLLC (PI) • Megalodon Regulatory Advisory Firm, PLLC (RA) Each company has: • its own TrackOps account • its own QuickBooks Online account The integration will be built in one centralized Make environment, but all company data must remain fully isolated by entity, with no crossover between businesses. TrackOps is my operational system of record for: • cases / jobs • customers / clients • invoices • time tracking / hours • mileage / expenses QuickBooks Online is my accounting system of record. The goal is for TrackOps activity to flow into QuickBooks Online with proper accounting treatment and minimal manual re-entry, while preserving clean books and reliable reporting. ________________________________________ Scope of Work I want this project structured into fixed-price milestones that align with the phases of work. A proposed structure is below, but I am open to reasonable adjustments if the contractor has a better recommendation. Milestone 1 – Discovery, Audit, and Foundation • Audit any existing Make scenarios / prior contractor work and document what is reusable versus what should be rebuilt • Review TrackOps API and webhook coverage for all required objects • Review and validate QuickBooks Online chart of accounts, products/services, classes, and other mapping structure relevant to the integration • Review my existing account mapping and identify any structural issues that need to be addressed before the build proceeds • Establish customer sync from TrackOps to QuickBooks Online • Implement duplicate prevention and standardized naming logic Milestone 2 – Core Invoicing, Payments, and Retainers • TrackOps invoices flowing into QuickBooks Online • Correct service / product mapping • Sales tax handling at the invoice line-item level • Payment recording and application to the correct invoice • Retainer handling logic: o retainer receipts booked properly o retainers applied against invoices---in TrackOps---as work is performed o clean accounting treatment in QBO Milestone 3 – Expense / Reimbursement Accounting • Client reimbursable expenses flowing correctly into QuickBooks Online • Administrative fee / markup logic where applicable • Mileage handling from TrackOps into QuickBooks Online • Travel / transportation reimbursement scenarios • Credit memos, debit memos, refunds, and related accounting treatment • Proper payable / reimbursement treatment for contractors or employees Milestone 4 – Profitability, Classification, and Delivery Logic • Case / engagement ID flow into a QuickBooks Online project field • Class / department mapping where appropriate • Product and service mapping refinement • Invoice delivery / emailing logic if included in the final design • Any related workflow needed to support cleaner engagement-level profitability reporting Milestone 5 – Payroll / Time Tracking / Contractor Payment Integration This phase is very important and needs to be approached carefully. TrackOps has a time tracking feature that captures hours by worker. I need the contractor to determine the maximum extent to which TrackOps time can be pushed into QuickBooks Online payroll-related workflows and records. I understand that QuickBooks Online does not permit outside developers to fully automate the final payroll run itself. I am not expecting a fully hands-off payroll run if Intuit’s restrictions do not allow it. However, I do expect this portion of the project to be taken as far as it can reasonably go. The goal of this phase is to automate as much of the payroll preparation workflow as possible, including where feasible: • TrackOps time flowing into QuickBooks Online payroll-related records, hours, or staging data • Worker-level time mapping by employee and/or contractor • Support for hourly payroll workflows to the maximum extent QuickBooks Online allows • Any feasible employee / contractor sync elements between TrackOps and QuickBooks Online • Any feasible support for workers compensation code mapping • Any feasible support for contractor / 1099 payment workflows • Clear identification of what can be automated versus what must remain manual due to Intuit limitations The final payroll run inside QuickBooks Online may remain a manual step, but the integration should be designed so that payroll preparation is automated as far as QuickBooks allows. I also want test runs performed during this phase so the payroll-related functionality can be verified. If something is not possible because of Intuit restrictions, I want that documented clearly, along with the maximum automatable portion and the manual procedure required to complete the payroll process. I do not want anyone overpromising payroll automation that QuickBooks Online will not allow. I do want this portion of the build pushed as far as it can reasonably go and verified with testing. Milestone 6 – Replication to PI and RA Once the Executive Protection build is functioning correctly, replicate the completed build to: • Megalodon Private Investigations Firm, PLLC • Megalodon Regulatory Advisory Firm, PLLC This includes: • adjusting services, accounts, and workflow logic as needed for each entity • maintaining full isolation of data and workflows between all three businesses • validating that each replicated build functions correctly in its own environment Milestone 7 – Testing, Error Handling, Documentation, and Handoff • End-to-end testing across all scenarios • Error handling and failure alerts so issues do not silently fail • Written documentation / runbook • Loom walkthrough or live walkthrough of the final system • Explanation of how to maintain the system and understand failures • Final handoff only after the system is functioning and verified ________________________________________ Required Skills / Experience Please do not apply unless you have real experience with the following: • Make.com automation builds • QuickBooks Online integrations • Accounting-aware workflow design, not just general automation • Invoices, payments, retainers, reimbursements, credits/refunds • Multi-step field mapping and debugging • API/webhook-based integration work • Multi-company / multi-account workflow organization Strong preference if you have experience with: • service businesses • legal / investigations / field services / case management style workflows • profitability / project / class tracking in QBO • payroll-related QBO integration limitations ________________________________________ Deliverables I expect the contractor to deliver working functionality, not just recommendations. That means: • functioning Make scenarios in my environment • correct mapping and accounting treatment • testing and proof of function • clear documentation of what was built, what is partially automated, and what remains manual due to platform limitations • professional communication throughout the project ________________________________________ Critical Milestone Verification Requirement This is extremely important. No milestone will be considered complete until the contractor demonstrates the work live and I verify that the milestone deliverables are functioning in my actual environment. For each milestone, I will require: 1. A live walkthrough / demonstration of the functionality 2. Proof of the actual Make scenarios and workflow logic 3. Proof that the workflow works in my environment 4. My confirmation that the milestone deliverables for that milestone have been satisfied Milestone payment will only be released after verification and acceptance. If you are uncomfortable with that, please do not apply. ________________________________________ Communication Expectations I value direct, professional communication. I do not need constant meetings, but I do need: • acknowledgment of questions • status updates when something is blocked • honesty if something is not possible • no disappearing • no vague milestone claims without proof If there is a technical limitation, I want it surfaced early and clearly. ________________________________________ Prior Contractor Experience / Expectations Going Forward I want to be transparent about why I am being very specific about communication and milestone verification. I have already had two unsuccessful contractor attempts on this project. In one case, the contractor struggled to communicate clearly and directly about the work. I made multiple requests during the engagement that every question I asked be answered clearly, directly, and in a timely manner. Even after I raised that issue more than once, I still was not getting clear answers to straightforward questions about project status, functionality, and next steps. Because communication and responsiveness are essential on a project like this, I ended that engagement. In another case, a contractor submitted a milestone payment request claiming a milestone was complete, but when I attempted to verify the work through a live walkthrough and demonstration, the contractor could not clearly demonstrate that the functionality had actually been built and working in my environment. That engagement was also terminated. I am not including this to be dramatic or difficult. I am including it so expectations are completely clear from the beginning. For this project, I need a contractor who can do all of the following consistently: • answer questions clearly, directly, and in a timely manner • communicate honestly about what is done, what is not done, and what is blocked • demonstrate completed work live before requesting milestone payment • surface technical limitations early instead of overpromising or avoiding direct answers If your communication style is vague, delayed, or indirect, or if you are not comfortable demonstrating completed work before requesting payment, then this project is probably not a good fit. ________________________________________ Proposal Instructions If you apply, please include the following: 1. A short explanation of your experience with Make.com and QuickBooks Online integrations 2. Examples of similar work you have completed 3. Your recommended milestone pricing for the milestone structure above 4. Your approach to retainers, reimbursements, and multi-company isolation 5. Your approach to the payroll / time-tracking phase, specifically how you would push TrackOps time data as far into QBO payroll workflows as QuickBooks allows 6. Your approach to milestone verification / live demonstration 7. Your honest view of what is and is not feasible with QuickBooks Online payroll-related automation Bonus points if you explain: • how you would prevent duplicate customers and bad data • how you would test the system before asking for milestone payment • how you would structure the Make environment to keep all three businesses cleanly separated ________________________________________ Budget / Engagement Structure I am open to fixed-price milestone proposals for the full project. I prefer to structure the engagement in multiple milestones rather than one large payment. I am open to contractors proposing their own pricing by milestone, but I want the proposal structured around the milestone framework above or a clearly justified alternative."

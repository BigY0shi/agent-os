                - textbox [ref=f17e629]: "Hi there! Happy to help you get those notes to your accountant. Yes — you can export individual notes: open a note, click the three-dot menu in the top right, choose Export, and pick PDF (https://help.nimbusnotes.example/import-export). To send a whole notebook at once, right-click the notebook in the sidebar and choose Export notebook, which gives you a .zip of all its notes in the format you pick (https://help.nimbusnotes.example/import-export). One heads-up: PDF export is a Pro plan feature, so you'll need Pro to use it — you can upgrade under Settings > Plan (https://help.nimbusnotes.example/billing). Next step: try exporting a single note to PDF from that three-dot menu, and let me know if you'd like a hand with the notebook export! Cheers, Nimbus Support"

                - textbox [ref=f3e540]: Yes, WPML can translate both custom post types and product categories. For your custom post type (properties), go to WPML > Settings and set it to 'Translatable - use translation if available (or fallback to default language)' under the Post Types Translation section. Save and check the translation editor. For WooCommerce product categories, go to WPML > Taxonomy Translation and add translations for each term in your secondary languages. If they still don't appear, set them to 'Translatable' under WPML > Settings and save. Let me know if you need help with anything else. Best, WPML Support

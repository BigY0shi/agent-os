                - textbox [ref=f3e646]: Thanks for reaching out. WPML installs like any WordPress plugin. After purchasing, download the WPML plugin files from your wpml.org account or install them automatically from your WordPress dashboard using your site key. Once active, register your site with your site key so WPML can download the additional components it needs (String Translation, Translation Management, and so on). Run the setup wizard to choose your site's default language, add other languages, and place a language switcher in your header menu. If you see development-mode or registration notices, they usually mean the site key hasn't been registered yet. Registering from WPML > Support or completing the setup wizard clears them. Theme compatibility is handled automatically for most themes. If something specific to your theme does not translate, tell us the theme name and we can point you to the theme-specific guidance. See https://wpml.org/faq/install-wpml/ for more details. Best, WPML Support

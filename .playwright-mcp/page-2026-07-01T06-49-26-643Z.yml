                - textbox [ref=f3e434]: Thanks for reaching out. To generate a tax invoice for your WPML purchase, log in to your account at https://wpml.org/faq/getting-your-tax-invoice-after-buying-wpml/. Find the order you want an invoice for and choose the option to generate or download it. You can also add company details or a VAT number on the invoice form before downloading. If you need to correct billing details on an invoice that was already issued, let us know the order and the details to change and we will help. To top up automatic translation credits, go to your wpml.org account and open the automatic translation or credits section at https://wpml.org/documentation/automatic-translation/automatic-translation-pricing/. There you can see how many credits you have used this period and purchase more. If you run out, you can buy additional credit packs from your account at any time, and they are used after your monthly allowance. Let me know if you need anything else. Best, WPML Support

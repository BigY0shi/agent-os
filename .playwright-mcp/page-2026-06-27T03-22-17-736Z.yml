            - generic [ref=e74]:
              - 'heading "HubSpot Sales Hub Implementation: Dialpad, Monday, Shopify, Mailchimp, Data Migration, Dashboards" [level=1] [ref=e75]'
              - generic [ref=e76]:
                - generic [ref=e77]: Posted 5 hours ago
                - generic [ref=e78]:
                  - img [ref=e80]
                  - paragraph [ref=e83]: Only freelancers located in the U.S. may apply.
                  - button "More info" [ref=e86] [cursor=pointer]:
                    - img [ref=e87]
            - generic [ref=e90]:
              - strong [ref=e91]: Summary
              - paragraph [ref=e92]: "We are looking for an experienced HubSpot Sales Hub Professional implementation specialist / RevOps consultant who can move quickly and help us get HubSpot fully set up as our sales command center. We are a B2B restaurant equipment and supply dealer with both sales-assisted quoting and e-commerce. We recently purchased HubSpot Sales Hub Professional and need it implemented properly, but we also need it done quickly. We have spoken with several HubSpot Solutions Partners, and many are quoting timelines of 8 to 10 weeks. That does not work for us. We are looking for someone who can start immediately and help us launch a functional first version within 2 to 3 weeks. This is not a basic app-connection project. We need someone who can think strategically, design the CRM structure, clean up data, build workflows, integrate key systems, create dashboards, and make the system simple enough for our sales team to actually use. Generic proposals will be ignored. Please include the phrase “HubSpot fast launch” in the first sentence of your proposal so we know you read this. Main goal: We want HubSpot to become our daily sales cockpit. Our sales team should be able to log in and immediately know: - Who to call - Who to text - Who to email - Which quotes need follow-up - Which leads are stale - Which deals are close to closing - Which customers need attention As the owner/manager, I need dashboards that show: - Pipeline by stage - Deal value - Sales rep activity - Quote follow-up compliance - Lead source performance - Closed won / closed lost deals - Stale opportunities - Calls, texts, emails, and tasks by rep - Shopify/e-commerce activity when relevant - Monday.com project status after a deal is won Systems we need connected or considered: - Dialpad - Monday.com - Shopify - Mailchimp - Excel / CSV contact lists Ideal timeline: We want a functional first version launched within 2 to 3 weeks, with cleanup, refinements, and more advanced automation continuing after launch. We understand everything may not be perfect on day one, but we need the core sales system live quickly. Phase 1: Fast Launch, 2 to 3 weeks - Core HubSpot Sales Hub setup - Sales pipeline - Deal stages - Contact, company, and deal properties - Lead source tracking - Basic data migration - Dialpad calling/texting setup - Basic Monday.com handoff - Sales sequences - Email templates/snippets - Rep task queues - Owner/manager dashboards - Basic sales team training Phase 2: Cleanup and Optimization - Advanced reporting - Deeper data cleanup and deduplication - Shopify optimization - Mailchimp/contact syncing strategy - More advanced workflows - Payment/invoicing workflow - Additional automation - SOPs and recorded walkthroughs - Post-launch support and cleanup Scope of work: 1. HubSpot Sales Hub Professional setup Set up and customize HubSpot Sales Hub Professional, including: - Sales pipeline - Deal stages - Lifecycle stages - Contact, company, and deal properties - Required fields - Lead source tracking - Sales ownership rules - Task queues - Templates - Snippets - Sequences - Workflows - Notifications - User setup and permissions The system needs to be powerful but simple. If the sales team finds it confusing, they will not use it. 2. Sales process and pipeline design Help us design a clean sales process. Possible deal stages may include: - New Lead - Qualified - Quote Needed - Quote Sent - Follow-Up Active - Verbal Yes / Pending Deposit - Deposit Paid / Closed Won - Handoff to Operations - Closed Lost We are open to your recommendations if you have a cleaner structure. 3. Dialpad integration We need Dialpad set up inside HubSpot for inbound and outbound sales communication. Requirements: - Inbound call logging - Outbound call logging - SMS/text logging - Click-to-call from HubSpot - Missed call task creation - Call outcome tracking - Call/text activity associated with contacts, companies, and deals when possible - Rep activity reporting - Manager visibility into calls, texts, and follow-up activity 4. Monday.com integration We use Monday.com for operations and project management. We want a clean handoff from sales to operations. Ideal workflow: When a deal is marked Closed Won or Deposit Paid in HubSpot, a project/item should be created in Monday.com with the key deal and customer information. Fields may include: - Customer name - Company - Main contact - Contact info - Deal amount - Salesperson - Quote link - Invoice/payment link - Project type - Estimated delivery/install date - Notes - Project status We would also like key Monday.com project statuses pushed back into HubSpot so sales and management can see project status without digging through Monday. 5. Shopify integration We use Shopify for our e-commerce website. We need HubSpot connected to Shopify in a way that helps our sales team follow up on high-intent customers without turning HubSpot into a messy product database. Important items: - Customer sync - Order/customer activity - Abandoned cart visibility - High-value cart/order alerts - Lead source tracking - E-commerce customer segmentation - Avoid duplicate contact creation - Avoid unnecessary product/SKU clutter inside HubSpot We have a large product catalog, so we need a thoughtful integration strategy, not a blind sync of everything. 6. Mailchimp integration / migration We currently have contacts in Mailchimp. We need help deciding whether to: - Keep Mailchimp connected short-term - Migrate contacts into HubSpot - Use Mailchimp only for broad email marketing - Eventually move more email marketing into HubSpot We need proper handling of: - Marketing contacts - Unsubscribes - Consent status - Duplicate contacts - Lists/audiences - Segmentation 7. Contact import and data cleanup We need contacts imported from: - Excel / CSV sheets - Monday.com - Mailchimp - Shopify/customer data Before import, we need help cleaning and deduplicating the data. Deduplication should consider: - Email - Phone number - Company name - Website/domain - Existing customer vs prospect - Lead source - Sales owner - Customer type We do not want a messy HubSpot database full of duplicate contacts and companies. 8. HubSpot payments / invoicing setup We want help setting up HubSpot invoicing/payments if it makes sense for our workflow. We would like the ability to send invoices and provide payment options. Important: We want to explore whether customers paying by credit card can be charged an additional 3% processing fee, but this must be set up in a compliant way. If HubSpot cannot do this properly, we would like recommendations for a better alternative, such as ACH/check discounting or separate payment terms. 9. Dashboards and reporting Build simple, useful dashboards for both sales reps and management. Sales rep dashboard should include: - Today’s tasks - Calls to make - Texts/emails to send - Quotes needing follow-up - Deals with no recent activity - New inbound leads - Active sequences - Open deals by stage Manager/owner dashboard should include: - Pipeline value by stage - Revenue forecast - Deals won/lost - Close rate - Average deal size - Activity by rep - Calls/texts/emails by rep - Quote follow-up compliance - Deals with no activity - Lead source performance - Shopify/e-commerce lead activity - Monday.com project status summary 10. Training and documentation We need the system to be easy for our salespeople to use. Please include: - Basic training for sales reps - Manager/admin training - Simple written SOPs - Loom/video walkthroughs if possible - Post-launch cleanup and adjustment period Ideal candidate: You should have strong experience with: - HubSpot Sales Hub Professional - HubSpot CRM architecture - RevOps - Sales pipelines - HubSpot workflows - HubSpot sequences - HubSpot reporting/dashboards - HubSpot data imports - Contact deduplication - Dialpad integrations - Monday.com integrations - Shopify integrations - Mailchimp integrations - Zapier or Make - B2B sales processes - Sales team training Bonus points if you have worked with: - Equipment dealers - Distributors - B2B e-commerce - Quoting-heavy sales teams - Sales-to-operations handoffs - Companies with both inbound and outbound sales What we do not want: We are not looking for someone who only knows how to connect apps. We need someone who can help design the structure, challenge bad ideas, keep things simple, and build a clean system our team will actually use. Please do not apply if your approach is just “sync everything and see what happens.” Please also do not apply if you cannot start immediately or if your timeline is 8 to 10 weeks. We need someone who can move quickly. Pricing: We are open to hourly or milestone-based pricing. We are not looking for the cheapest option, but we do expect the price to match the scope, timeline, and experience level. Please do not simply bid the maximum budget. In your proposal, include: 1. Your estimated hours or fixed project range 2. Your proposed milestones 3. What you would complete in the first 2 to 3 weeks 4. What should be pushed to phase two 5. Any risks, dependencies, or items that could increase cost Application questions: Please answer the following when applying: 1. Can you start immediately? 2. Can you launch a functional first version within 2 to 3 weeks? 3. Describe a HubSpot Sales Hub Professional setup you’ve completed that involved multiple integrations. 4. Have you integrated HubSpot with Dialpad before? If yes, what did you set up? 5. Have you integrated HubSpot with Monday.com before? If yes, what was the workflow? 6. Have you worked with Shopify and HubSpot together? How did you avoid unnecessary data clutter? 7. How do you approach contact deduplication before importing data into HubSpot? 8. What dashboards would you recommend for a sales manager managing a small B2B sales team? 9. What would your implementation plan look like for this project? 10. What would you need from us before starting? 11. What parts of this project would you launch first, and what would you push to phase two? 12. What is your estimated hourly, fixed project, or milestone-based pricing? Quality matters, but speed matters too. We need someone who can build this correctly without dragging it out for months."
